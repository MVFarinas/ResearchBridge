[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "researchbridge-rbbench"
version = "0.1.0"
description = "ResearchBridge faithfulness benchmark (decisions.md §1.4): candidate selection, ingest, rewrite harness, claim decomposition, rubric, rater packets, agreement statistics and LLM judge."
readme = "README.md"
requires-python = ">=3.12"
# Private package: the classifier makes PyPI refuse an accidental upload.
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3.12"]
dependencies = [
  "researchbridge-rbcore",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[project.scripts]
rbbench = "rbbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rbbench = ["py.typed", "packets/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error"]
markers = [
  "network: test needs network access (never run by default)",
  "factpico: test needs the FactPICO data downloaded into data/ (skipped when absent)",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
