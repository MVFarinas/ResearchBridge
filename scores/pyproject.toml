[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "researchbridge-scores"
version = "0.1.0"
description = "ResearchBridge Track R: PROVISIONAL readability and prior-knowledge burden scores, and their validation."
readme = "README.md"
requires-python = ">=3.12"
# Private package: the classifier makes PyPI refuse an accidental upload.
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3.12"]
dependencies = [
  "researchbridge-rbcore",
  "spacy>=3.8.16,<3.9",
  # spaCy's small English pipeline (MIT). Not on PyPI: installed into the
  # virtualenv from the spaCy release, never committed to the repository.
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  # Code Apache-2.0; bundled frequency data CC BY-SA 4.0 (see docs/licence-inventory.md).
  "wordfreq>=3.1.1,<4",
]

[project.scripts]
rbscores = "rbscores.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rbscores = ["py.typed", "readability/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error"]
markers = [
  "network: test needs network access (never run by default)",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
