[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "researchbridge-devtools"
version = "0.1.0"
description = "ResearchBridge repository checks (docstring coverage, lock coverage) used by make lint."
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3.12"]
dependencies = []

[project.scripts]
rb-check-docstrings = "rb_devtools.check_docstrings:main"
rb-check-lock = "rb_devtools.check_lock:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
